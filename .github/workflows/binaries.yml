name: Binaries

on:
  push:
    branches: [main]
  pull_request:
  # `release-cli.yml` calls this with upload: true once a CLI tag is green.
  workflow_call:
    inputs:
      upload:
        description: Attach the archives to the GitHub Release for this tag.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A half-finished set of release assets is worse than a slow one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      # Only the upload step needs this, and it is tag-only.
      contents: write
    strategy:
      # An outage on one architecture must not withhold the others.
      fail-fast: false
      matrix:
        include:
          - runner: macos-26 # newest GA macOS image; Apple silicon
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04-arm # native arm64: no qemu, no cross toolchain
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          # Every target here is its runner's host, so this is a no-op that
          # turns a wrong runner label into a link error instead of a binary
          # mislabelled by the archive name.
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: bin-${{ matrix.target }}

      - run: cargo build --release --locked -p expensify-cli --target ${{ matrix.target }}

      - name: Package
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "expensify-cli") | .version')"
          name="expensify-cli-${version}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/expensify" "dist/${name}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          shasum -a 256 "${name}.tar.gz" >"${name}.tar.gz.sha256"
          {
            echo "asset=${name}.tar.gz"
            echo "version=${version}"
          } >>"$GITHUB_OUTPUT"

      - name: Unpack and run it
        env:
          ASSET: ${{ steps.pkg.outputs.asset }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          shasum -a 256 -c "${ASSET}.sha256"
          tar -xzf "$ASSET" -C "$RUNNER_TEMP"
          got="$("${RUNNER_TEMP}/${ASSET%.tar.gz}/expensify" --version)"
          [ "$got" = "expensify ${VERSION}" ] || { echo "unexpected: $got" >&2; exit 1; }

      - name: Attach to the release
        if: inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.pkg.outputs.asset }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$ASSET" "${ASSET}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
