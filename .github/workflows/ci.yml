name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `stable` and the advisory database both move without a commit here.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  # The release workflows gate publishing on this suite.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debuginfo dominated the cached target dir (440 MB), and restore time is now
  # the bulk of a warm job. Line tables keep panic backtraces pointing at real
  # file:line while dropping the variable/type DWARF that CI never reads.
  # rust-cache hashes CARGO_* into its key, so this must match in warm-cache.yml.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Uncached: rustfmt parses, it does not compile, so there is nothing to reuse.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: all-features
            flags: --all-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          cache-key: stable
      - run: cargo clippy --workspace --locked --all-targets ${{ matrix.flags }} -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: all-features
            flags: --all-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: stable
      # trybuild compares against committed rustc diagnostics, which drift
      # between releases; the `ui` job owns that check on a pinned toolchain.
      - run: cargo test --workspace --locked ${{ matrix.flags }} -- --skip misuses_do_not_compile

  ui:
    name: trybuild (rustc 1.96.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          # Pinned: bump only together with regenerating tests/ui/*.stderr. Kept
          # on its own cache key for the same reason — these .stderr expectations
          # are only valid for this exact rustc, so no stable-toolchain job may
          # ever share a target dir with it.
          toolchain: "1.96.1"
          cache-key: ui
      - run: cargo test --locked --all-features -p expensify --test compile_fail

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: stable
      # Matches the docs.rs build configured in Cargo.toml. Library only:
      # the CLI is a binary, and its rustdoc output collides with the lib's.
      #
      # RUSTDOCFLAGS is set on the step, not the job: rust-cache folds RUST* env
      # into its key, and a job-level value would fork this onto a private cache
      # for no gain — it only governs warnings in this crate, which rustdoc
      # rebuilds here either way.
      - run: cargo doc --locked --all-features --no-deps -p expensify
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          # Keep in step with `rust-version` in Cargo.toml.
          toolchain: "1.88"
          cache-key: msrv
      # Library only: `rust-version` is a promise to consumers, and neither
      # dev dependencies nor the CLI are part of it. (The CLI does build on
      # 1.88 today; that is not a promise.)
      - run: cargo check --locked --all-features -p expensify

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A prebuilt binary. cargo-deny-action is a Dockerfile action and spent
      # 10-16s building its image on every single run.
      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-deny@0.20.2
      # Deliberately uncached — both the target dir (cargo-deny compiles nothing,
      # it reads Cargo.lock) and ~/.cargo/advisory-db. A cached advisory database
      # would let this pass against yesterday's RustSec, which is the single
      # thing the job exists to catch.
      - run: cargo deny --locked check
