[workspace]
members = ["cli"]
resolver = "3"

[package]
name = "expensify"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Client for the Expensify Integration Server API"
repository = "https://github.com/xrl/expensify-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["expensify", "expenses", "api-client", "accounting", "finance"]
categories = ["api-bindings", "web-programming::http-client"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
bytes = "1"
governor = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }

[dev-dependencies]
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
trybuild = "1"
wiremock = "0.6"

[features]
default = []
employee-updater-deprecated = ["reqwest/multipart"]
