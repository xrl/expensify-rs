[package]
name = "expensify-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Command-line client for the Expensify Integration Server API"
repository = "https://github.com/xrl/expensify-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["expensify", "cli", "expenses", "accounting", "finance"]
categories = ["command-line-utilities"]

[[bin]]
name = "expensify"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "wrap_help"] }
clap_complete = "4.6.8"
comfy-table = "7.2.2"
expensify = { path = "..", version = "0.2.0" }
keyring = "4.1.6"
rpassword = "7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["macros", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "registry",
    "ansi",
    "fmt",
    "std",
] }
